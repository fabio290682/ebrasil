services:
  - type: web
    name: ebrasil-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_BACKEND
        value: sqlite
      - key: CORS_ORIGINS
        value: https://SEU-FRONTEND.onrender.com,http://localhost:5173
      - key: PORTAL_TRANSPARENCIA_API_KEY
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB
        value: transparencia

  - type: static
    name: ebrasil-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://SEU-BACKEND.onrender.com

  # n8n (workflows) - roda como servico separado do backend/frontend.
  # Recomendo apontar DB_* para um Postgres gerenciado (Render Postgres ou Supabase).
  - type: web
    name: ebrasil-n8n
    runtime: docker
    image:
      url: n8nio/n8n:latest
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1
    envVars:
      - key: N8N_HOST
        value: SEU-N8N.onrender.com
      - key: N8N_PORT
        value: 443
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_EDITOR_BASE_URL
        value: https://SEU-N8N.onrender.com
      - key: WEBHOOK_URL
        value: https://SEU-N8N.onrender.com
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: N8N_BASIC_AUTH_ACTIVE
        value: true
      - key: N8N_BASIC_AUTH_USER
        sync: false
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false
      - key: N8N_SECURE_COOKIE
        value: true
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: true
      - key: GENERIC_TIMEZONE
        value: America/Sao_Paulo
      - key: TZ
        value: America/Sao_Paulo
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: ebrasil-n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: ebrasil-n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: ebrasil-n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: ebrasil-n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: ebrasil-n8n-db
          property: password
      - key: DB_POSTGRESDB_SCHEMA
        value: public
      - key: OPENAI_API_KEY
        sync: false
      - key: PORTAL_TRANSPARENCIA_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false

databases:
  - name: ebrasil-n8n-db
    plan: starter
    databaseName: n8n
    user: n8n_user
