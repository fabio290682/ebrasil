services:
  # Backend - API FastAPI
  - type: web
    name: ebrasil-backend
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_BACKEND
        value: sqlite # Ou 'mongo'/'postgres' se configurado
      - key: PORTAL_TRANSPARENCIA_API_KEY
        sync: false # Defina manualmente no painel do Render
      - key: CORS_ORIGINS
        value: '*' # Em produção, substitua pela URL do seu frontend

  # Frontend - React (Static Site)
  - type: static
    name: ebrasil-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    publishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ebrasil-backend
          property: url

  # Automação - n8n (Docker)
  # (Removido do Blueprint por padrão: o `n8n/Dockerfile` não existe neste repo.)

databases: []
