version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ebrasil-postgres
    environment:
      POSTGRES_USER: ebrasil
      POSTGRES_PASSWORD: ebrasil_dev
      POSTGRES_DB: ebrasil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebrasil"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ebrasil-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB (optional)
  mongodb:
    image: mongo:7
    container_name: ebrasil-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ebrasil
      MONGO_INITDB_ROOT_PASSWORD: ebrasil_dev
      MONGO_INITDB_DATABASE: ebrasil
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ebrasil-backend
    environment:
      ENVIRONMENT: development
      DATABASE_BACKEND: sqlite
      DATABASE_URL: sqlite:///./ebrasil.db
      MONGODB_URL: mongodb://ebrasil:ebrasil_dev@mongodb:27017/ebrasil
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      API_PREFIX: /api/v1
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      PORTAL_TRANSPARENCIA_API_KEY: ${PORTAL_TRANSPARENCIA_API_KEY:-dev_key}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (optional - use npm dev instead)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: ebrasil-frontend
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_API_BASE_URL: http://backend:8000/api/v1
  #   volumes:
  #     - ./frontend:/app
  #   depends_on:
  #     - backend
  #   command: npm run dev

volumes:
  postgres_data:
  redis_data:
  mongodb_data:

networks:
  default:
    name: ebrasil-network
