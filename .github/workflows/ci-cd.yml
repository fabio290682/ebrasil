name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Import check (smoke test)
        run: |
          cd backend
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          os.environ.setdefault('DATABASE_BACKEND', 'sqlite')
          os.environ.setdefault('ENVIRONMENT', 'development')
          from app.config import DATABASE_URL, API_PREFIX
          from app.models import GastoPublico, Municipio, RpaFonte, RpaLog
          from app.rpa.runner import list_agents
          agents = list_agents()
          print(f'OK — {len(agents)} agentes RPA registrados: {[a.fonte_id for a in agents]}')
          "

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

  deploy-railway:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Railway deploy
        run: |
          curl -s -X POST "${{ secrets.RAILWAY_DEPLOY_WEBHOOK }}" \
            -H "Content-Type: application/json" || echo "Webhook não configurado — Railway faz deploy automático via GitHub."
        continue-on-error: true
